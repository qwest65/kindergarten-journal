<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f7fb">
<meta name="robots" content="noindex,nofollow">
<title>Журнал детского сада</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<noscript>Для работы журнала нужен включённый JavaScript.</noscript>

<div id="screen-loading" class="center-screen"><div class="spinner"></div><p>Загрузка…</p></div>

<div id="screen-login" class="center-screen hidden">
  <form class="card auth-card" id="loginForm" autocomplete="on">
    <div class="brand-big"><span class="brand-mark">✿</span><div><strong>Детский сад</strong><small>Электронный журнал</small></div></div>
    <div class="field"><label for="loginName">Логин</label><input id="loginName" name="username" autocomplete="username" required autocapitalize="none" spellcheck="false"></div>
    <div class="field"><label for="loginPass">Пароль</label><input id="loginPass" name="password" type="password" autocomplete="current-password" required></div>
    <label class="check"><input type="checkbox" id="loginRemember"> Запомнить на этом устройстве</label>
    <div class="form-error" id="loginError"></div>
    <button class="btn primary block" type="submit" id="loginBtn">Войти</button>
    <button class="link-btn" type="button" id="recoverLink">Восстановить доступ администратора</button>
  </form>
</div>

<div id="screen-setup" class="center-screen hidden">
  <form class="card auth-card wide" id="setupForm" autocomplete="off">
    <h1 id="setupTitle">Первоначальная настройка</h1>
    <p class="hint" id="setupHint">Выполняется один раз. Нужен ключ доступа GitHub (токен) с правом записи в оба репозитория — сайта и данных.</p>
    <div class="field"><label for="setupRepo">Приватный репозиторий с данными</label><input id="setupRepo" required spellcheck="false"></div>
    <div class="field"><label for="setupToken">Ключ доступа GitHub (токен)</label><input id="setupToken" type="password" required spellcheck="false" placeholder="github_pat_…"></div>
    <div class="field" id="setupNameField"><label for="setupName">Ваше имя (как будет в журнале)</label><input id="setupName" placeholder="Например, Администратор"></div>
    <div class="field"><label for="setupLogin">Логин администратора</label><input id="setupLogin" required autocapitalize="none" spellcheck="false" placeholder="например, admin"></div>
    <div class="field"><label for="setupPass">Новый пароль (не короче 10 символов)</label><input id="setupPass" type="password" required minlength="10" autocomplete="new-password"></div>
    <div class="field"><label for="setupPass2">Пароль ещё раз</label><input id="setupPass2" type="password" required minlength="10" autocomplete="new-password"></div>
    <div class="form-error" id="setupError"></div>
    <button class="btn primary block" type="submit" id="setupBtn">Сохранить и войти</button>
    <button class="link-btn" type="button" id="setupBack">← Ко входу</button>
  </form>
</div>

<div id="screen-app" class="hidden">
  <header class="topbar">
    <div class="topbar-row">
      <div class="brand"><span class="brand-mark">✿</span><strong>Журнал детского сада</strong></div>
      <button class="user-btn" id="userBtn" type="button"></button>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <main class="main" id="view"></main>
</div>

<div id="modalRoot"></div>
<div id="toastRoot" aria-live="polite"></div>
<div id="busy" class="busy hidden"><div class="busy-box"><div class="spinner"></div><span id="busyText">Сохраняю…</span></div></div>

<script src="app.js"></script>
</body>
</html>
